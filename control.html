<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitstellen-Steuerung</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen p-4 flex flex-col font-sans">

    <!-- Header mit Raum-Anzeige -->
    <div class="bg-gray-800 border-b-2 border-red-500 p-4 rounded-t flex justify-between items-center shadow-lg">
        <h1 class="text-2xl font-bold text-red-500 flex items-center gap-2">
            📡 DISPATCH KONTROLLZENTRUM
        </h1>
        <div class="bg-gray-900 px-4 py-1 rounded text-sm text-gray-400 border border-gray-700">
            RAUM: <span id="ui-room" class="font-bold text-yellow-400 text-lg ml-1">...</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex gap-4 mt-4 overflow-hidden">
        
        <!-- Left: Notfallbilder -->
        <div class="w-1/2 flex flex-col gap-2">
            <h2 class="text-gray-400 font-bold mb-2">SCHNELL-ALARMIERUNG (SZENARIEN)</h2>
            <div class="grid grid-cols-2 gap-2 flex-1 auto-rows-max overflow-y-auto pr-2">
                <button class="bg-gray-800 hover:bg-gray-700 border border-gray-600 p-3 rounded text-left transition" onclick="loadScenario('ACS')">
                    <div class="text-red-400 font-bold">Thoraxschmerz / ACS</div>
                    <div class="text-xs text-gray-400">10D05 | Verdacht auf Herzinfarkt</div>
                </button>
                <button class="bg-gray-800 hover:bg-gray-700 border border-gray-600 p-3 rounded text-left transition" onclick="loadScenario('APOPLEX')">
                    <div class="text-orange-400 font-bold">Apoplex / Schlaganfall</div>
                    <div class="text-xs text-gray-400">28C01 | Neurologisches Defizit</div>
                </button>
                <button class="bg-gray-800 hover:bg-gray-700 border border-gray-600 p-3 rounded text-left transition" onclick="loadScenario('ATEMNOT')">
                    <div class="text-blue-400 font-bold">Atemnot (Schwer)</div>
                    <div class="text-xs text-gray-400">06D02 | Dyspnoe, COPD, Asthma</div>
                </button>
                <button class="bg-gray-800 hover:bg-gray-700 border border-gray-600 p-3 rounded text-left transition" onclick="loadScenario('KRAMPF')">
                    <div class="text-purple-400 font-bold">Krampfanfall</div>
                    <div class="text-xs text-gray-400">12D02 | Status Epilepticus</div>
                </button>
                <button class="bg-gray-800 hover:bg-gray-700 border border-gray-600 p-3 rounded text-left transition" onclick="loadScenario('TRAUMA')">
                    <div class="text-yellow-400 font-bold">Verkehrsunfall</div>
                    <div class="text-xs text-gray-400">29D02 | PKW vs. Fußgänger</div>
                </button>
                <button class="bg-gray-800 hover:bg-gray-700 border border-gray-600 p-3 rounded text-left transition" onclick="loadScenario('STURZ')">
                    <div class="text-yellow-400 font-bold">Sturz aus Höhe</div>
                    <div class="text-xs text-gray-400">17D03 | >3 Meter, Polytrauma</div>
                </button>
            </div>
        </div>

        <!-- Right: Vorschau & Senden -->
        <div class="w-1/2 flex flex-col bg-gray-800 rounded border border-gray-700 p-4">
            <h2 class="text-gray-400 font-bold mb-4">DATEN-VORSCHAU</h2>
            
            <div class="grid grid-cols-2 gap-4 text-sm mb-4">
                <div><label class="text-gray-500 block text-xs">Auftrags-Nr (R)</label><input id="inp_r_nr" class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white" readonly></div>
                <div><label class="text-gray-500 block text-xs">Transport-Nr (T)</label><input id="inp_t_nr" class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white" readonly></div>
                
                <div class="col-span-2"><label class="text-gray-500 block text-xs">Adresse (BO)</label><input id="inp_bo" class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white"></div>
                
                <div><label class="text-gray-500 block text-xs">AMPDS Code</label><input id="inp_code" class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white"></div>
                <div><label class="text-gray-500 block text-xs">Patientenname</label><input id="inp_name" class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white"></div>
                
                <div><label class="text-gray-500 block text-xs">Geburtsdatum</label><input id="inp_geb" class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white"></div>
                <div><label class="text-gray-500 block text-xs">SV-Nummer</label><input id="inp_sv" class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white font-mono text-yellow-400"></div>
                
                <div class="col-span-2"><label class="text-gray-500 block text-xs">Freitext (FTEXT)</label><textarea id="inp_ftext" class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white h-20 resize-none"></textarea></div>
            </div>

            <button onclick="sendDispatch()" class="mt-auto bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded text-xl shadow-[0_0_15px_rgba(220,38,38,0.5)] transition flex items-center justify-center gap-3">
                🚨 ALARMIERUNG IN DEN RAUM SENDEN
            </button>
        </div>
    </div>

    <script>
        // RAUM-LOGIK AUSLESEN
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room') || 'SIM1';
        document.getElementById('ui-room').innerText = roomCode;

        // Netzwerk-Setup (Raum im WS-Pfad mitgeben)
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        let ws = new WebSocket(`${protocol}//${location.host}?room=${roomCode}`);
        const bc = new BroadcastChannel('sim_data_' + roomCode);

        // Szenarien Datenbank
        const scenarios = {
            'ACS': { code: '10D05', ftext: 'Notruf durch Ehefrau. Patient klagt über starke Brustschmerzen, ausstrahlend in linken Arm. Kaltschweißig.', name: 'Mustermann, Franz', geb: '12.05.1965', geschlecht: 'männlich', bo: 'Hauptstraße 15/3\n1030 Wien\nTür-Code: 1234' },
            'APOPLEX': { code: '28C01', ftext: 'Plötzliche Sprachstörung und halbseitige Lähmung rechts. Begann vor ca. 30 Minuten. Patient ist wach.', name: 'Huber, Maria', geb: '23.08.1952', geschlecht: 'weiblich', bo: 'Ringstraße 1/14\n1010 Wien\nLift im Haus' },
            'ATEMNOT': { code: '06D02', ftext: 'Schwere Atemnot, zyanotisch. Bekanntes schweres Asthma. Sprechen kaum noch möglich.', name: 'Bauer, Stefan', geb: '09.11.1988', geschlecht: 'männlich', bo: 'Praterstern 3\n1020 Wien\nBeim Bahnhofseingang' },
            'KRAMPF': { code: '12D02', ftext: 'Status Epilepticus auf offener Straße. Krampfte bereits 3x hintereinander. Blutet aus dem Mund.', name: 'Unbekannt, Männlich', geb: '01.01.1990', geschlecht: 'männlich', bo: 'Mariahilfer Straße 50\n1070 Wien\nVor dem Schuhgeschäft' },
            'TRAUMA': { code: '29D02', ftext: 'Verkehrsunfall PKW gegen Fußgänger. Patient liegt am Boden, nicht ansprechbar. Starke Blutung am Kopf.', name: 'Gruber, Anna', geb: '17.03.2001', geschlecht: 'weiblich', bo: 'Gürtel / Burggasse\n1150 Wien\nKreuzungsbereich' },
            'STURZ': { code: '17D03', ftext: 'Bauarbeiter aus ca. 4 Metern Höhe vom Gerüst gestürzt. Klagt über starke Rückenschmerzen, Beine taub.', name: 'Wagner, Thomas', geb: '30.06.1979', geschlecht: 'männlich', bo: 'Baustelle Nordbahnhof\n1020 Wien\nZufahrt über Tor 2' }
        };

        function generateId(prefix) { return prefix + Math.floor(Math.random() * 900000 + 100000); }

        function generateSV(gebDatum) {
            const parts = gebDatum.split('.');
            const gebCode = parts[0] + parts[1] + parts[2].substring(2); // TTMMJJ
            const random4 = Math.floor(1000 + Math.random() * 9000); // 4-stellige Nummer
            return `${random4} ${gebCode}`;
        }

        let currentPayload = null;

        function loadScenario(type) {
            const s = scenarios[type];
            const geb = s.geb;
            const sv = generateSV(geb);
            
            currentPayload = {
                type: 'ALARM',
                r_nr: generateId('R'), t_nr: generateId('T'),
                bo: s.bo, code: s.code, ftext: s.ftext,
                name: s.name, geb: geb, sv: sv, geschlecht: s.geschlecht,
                timestamp: new Date().toLocaleString('de-DE')
            };

            document.getElementById('inp_r_nr').value = currentPayload.r_nr;
            document.getElementById('inp_t_nr').value = currentPayload.t_nr;
            document.getElementById('inp_bo').value = currentPayload.bo;
            document.getElementById('inp_code').value = currentPayload.code;
            document.getElementById('inp_name').value = currentPayload.name;
            document.getElementById('inp_geb').value = currentPayload.geb;
            document.getElementById('inp_sv').value = currentPayload.sv;
            document.getElementById('inp_ftext').value = currentPayload.ftext;
        }

        function sendDispatch() {
            if(!currentPayload) return alert('Bitte zuerst ein Szenario auswählen!');
            const msg = JSON.stringify(currentPayload);
            if(ws.readyState === WebSocket.OPEN) ws.send(msg);
            bc.postMessage(currentPayload); // Fallback für lokales Training in 2 Tabs
            
            alert('Alarmierung erfolgreich in den Raum ' + roomCode + ' gesendet!');
        }
        
        // Initial ein leeres Laden
        loadScenario('ACS');
    </script>
</body>
</html>
