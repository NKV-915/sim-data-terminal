<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Leitstellen-Steuerung | Dispatch Control</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        tech: ['Chakra Petch', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        dispatch: {
                            base: '#080c14',
                            card: '#0f172a',
                            panel: '#151f32',
                            border: '#1e293b',
                            red: '#ef4444',
                            orange: '#f97316',
                            yellow: '#eab308',
                            blue: '#0284c7',
                            neon: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #080c14;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(2, 132, 199, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(239, 68, 68, 0.06) 0%, transparent 40%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            touch-action: manipulation;
        }

        .glow-red { box-shadow: 0 0 25px -4px rgba(239, 68, 68, 0.45); }
        .glow-blue { box-shadow: 0 0 20px -3px rgba(56, 189, 248, 0.35); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @keyframes radar-pulse {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.15); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }
        .pulse-dot { animation: radar-pulse 2s infinite ease-in-out; }
    </style>
</head>
<body class="text-slate-100 h-screen flex flex-col overflow-hidden font-sans select-none">

    <!-- Statusleiste -->
    <header class="h-14 bg-dispatch-card/90 backdrop-blur border-b border-slate-800 px-5 flex items-center justify-between shrink-0 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="relative flex items-center justify-center w-8 h-8 rounded-lg bg-red-950/60 border border-red-500/40">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500 pulse-dot"></span>
            </div>
            <div>
                <h1 class="font-tech text-lg font-bold tracking-wider text-slate-100 flex items-center gap-2">
                    DISPATCH CONTROL <span class="text-xs px-2 py-0.5 rounded bg-sky-950 border border-sky-500/30 text-sky-400 font-mono">CAD-915</span>
                </h1>
                <p class="text-[10px] text-slate-400 tracking-wider">EINSATZLEITUNG & SIMULATIONS-STEUERUNG</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-700/80 px-3 py-1.5 rounded-lg shadow-inner">
                <span class="text-[11px] font-mono font-semibold text-slate-400">RAUM:</span>
                <input id="input-room" class="bg-black/60 border border-slate-600 rounded px-2 py-0.5 font-mono text-sm font-bold text-yellow-400 w-24 text-center uppercase tracking-wider focus:border-yellow-400 focus:outline-none" value="SIM1">
                <button onclick="changeRoom()" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-slate-200 transition">Setzen</button>
            </div>

            <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-700/80 px-3 py-1.5 rounded-lg">
                <span id="conn-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                <span id="conn-text" class="text-xs font-mono font-medium text-amber-400">VERBINDE...</span>
            </div>

            <div class="font-mono text-right pl-2 border-l border-slate-800">
                <div id="clock-time" class="text-base font-bold text-slate-100 leading-none">12:00:00</div>
                <div id="clock-date" class="text-[10px] text-slate-400 leading-none mt-1">01.01.2026</div>
            </div>
        </div>
    </header>

    <!-- Split-Layout -->
    <main class="flex-1 flex gap-4 p-4 overflow-hidden">
        <!-- Notfall-Vorlagen -->
        <section class="w-[52%] flex flex-col gap-2.5 overflow-hidden">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-tech font-bold text-slate-400 tracking-wider">AMPDS EINSATZSZENARIEN</span>
                    <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-mono">8 VORLAGEN</span>
                </div>
                <span class="text-[11px] text-slate-400">Klick generiert Daten neu</span>
            </div>

            <div class="flex-1 grid grid-cols-2 gap-2.5 overflow-y-auto pr-1">
                <button onclick="selectScenario('ACS')" class="group text-left p-3 rounded-xl bg-dispatch-panel/70 border border-red-900/40 hover:border-red-500 hover:bg-red-950/20 transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-mono text-xs font-bold text-red-400 bg-red-950/70 border border-red-800/60 px-2 py-0.5 rounded">10D05</span>
                            <span class="text-[10px] font-mono text-slate-400">DELTA</span>
                        </div>
                        <div class="font-tech text-sm font-bold text-slate-100 group-hover:text-red-300">Thoraxschmerz / ACS</div>
                        <div class="text-[11px] text-slate-400 line-clamp-2 mt-1">Vernichtungsschmerz retrosternal, Ausstrahlung li. Arm, kaltschweißig.</div>
                    </div>
                    <div class="text-[10px] text-slate-400 mt-2 font-mono flex items-center justify-between pt-1 border-t border-slate-800/80">
                        <span>1030 Wien</span><span>65 J. • M</span>
                    </div>
                </button>

                <button onclick="selectScenario('APOPLEX')" class="group text-left p-3 rounded-xl bg-dispatch-panel/70 border border-orange-900/40 hover:border-orange-500 hover:bg-orange-950/20 transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-mono text-xs font-bold text-orange-400 bg-orange-950/70 border border-orange-800/60 px-2 py-0.5 rounded">28C01</span>
                            <span class="text-[10px] font-mono text-slate-400">CHARLIE</span>
                        </div>
                        <div class="font-tech text-sm font-bold text-slate-100 group-hover:text-orange-300">Apoplex / Schlaganfall</div>
                        <div class="text-[11px] text-slate-400 line-clamp-2 mt-1">FAST positiv: Fazialisparese, Armheberschwäche, Aphasie seit 25 Min.</div>
                    </div>
                    <div class="text-[10px] text-slate-400 mt-2 font-mono flex items-center justify-between pt-1 border-t border-slate-800/80">
                        <span>1150 Wien</span><span>74 J. • W</span>
                    </div>
                </button>

                <button onclick="selectScenario('ATEMNOT')" class="group text-left p-3 rounded-xl bg-dispatch-panel/70 border border-sky-900/40 hover:border-sky-500 hover:bg-sky-950/20 transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-mono text-xs font-bold text-sky-400 bg-sky-950/70 border border-sky-800/60 px-2 py-0.5 rounded">06D02</span>
                            <span class="text-[10px] font-mono text-slate-400">DELTA</span>
                        </div>
                        <div class="font-tech text-sm font-bold text-slate-100 group-hover:text-sky-300">Schwere Dyspnoe</div>
                        <div class="text-[11px] text-slate-400 line-clamp-2 mt-1">Zyanose, Stridor, schwere COPD/Asthma-Exazerbation, SpO2 78%.</div>
                    </div>
                    <div class="text-[10px] text-slate-400 mt-2 font-mono flex items-center justify-between pt-1 border-t border-slate-800/80">
                        <span>1020 Wien</span><span>58 J. • M</span>
                    </div>
                </button>

                <button onclick="selectScenario('KRAMPF')" class="group text-left p-3 rounded-xl bg-dispatch-panel/70 border border-purple-900/40 hover:border-purple-500 hover:bg-purple-950/20 transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-mono text-xs font-bold text-purple-400 bg-purple-950/70 border border-purple-800/60 px-2 py-0.5 rounded">12D02</span>
                            <span class="text-[10px] font-mono text-slate-400">DELTA</span>
                        </div>
                        <div class="font-tech text-sm font-bold text-slate-100 group-hover:text-purple-300">Status Epilepticus</div>
                        <div class="text-[11px] text-slate-400 line-clamp-2 mt-1">Tonisch-klonische Serie ohne Wiedererlangen des Bewusstseins. Zungenbiss.</div>
                    </div>
                    <div class="text-[10px] text-slate-400 mt-2 font-mono flex items-center justify-between pt-1 border-t border-slate-800/80">
                        <span>1070 Wien</span><span>36 J. • M</span>
                    </div>
                </button>

                <button onclick="selectScenario('TRAUMA')" class="group text-left p-3 rounded-xl bg-dispatch-panel/70 border border-amber-900/40 hover:border-amber-500 hover:bg-amber-950/20 transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-mono text-xs font-bold text-amber-400 bg-amber-950/70 border border-amber-800/60 px-2 py-0.5 rounded">29D02</span>
                            <span class="text-[10px] font-mono text-slate-400">DELTA</span>
                        </div>
                        <div class="font-tech text-sm font-bold text-slate-100 group-hover:text-amber-300">Verkehrsunfall / PKW vs Fuß</div>
                        <div class="text-[11px] text-slate-400 line-clamp-2 mt-1">Fußgänger von PKW erfasst, über Motorhaube geschleudert. SHT II.</div>
                    </div>
                    <div class="text-[10px] text-slate-400 mt-2 font-mono flex items-center justify-between pt-1 border-t border-slate-800/80">
                        <span>1100 Wien</span><span>24 J. • W</span>
                    </div>
                </button>

                <button onclick="selectScenario('STURZ')" class="group text-left p-3 rounded-xl bg-dispatch-panel/70 border border-yellow-900/40 hover:border-yellow-500 hover:bg-yellow-950/20 transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-mono text-xs font-bold text-yellow-400 bg-yellow-950/70 border border-yellow-800/60 px-2 py-0.5 rounded">17D03</span>
                            <span class="text-[10px] font-mono text-slate-400">DELTA</span>
                        </div>
                        <div class="font-tech text-sm font-bold text-slate-100 group-hover:text-yellow-300">Sturz aus Höhe (>4m)</div>
                        <div class="text-[11px] text-slate-400 line-clamp-2 mt-1">Gerüststurz Baustelle. Verdacht auf Wirbelsäulen- und Beckentrauma.</div>
                    </div>
                    <div class="text-[10px] text-slate-400 mt-2 font-mono flex items-center justify-between pt-1 border-t border-slate-800/80">
                        <span>1210 Wien</span><span>42 J. • M</span>
                    </div>
                </button>

                <button onclick="selectScenario('ANAPHYLAXIE')" class="group text-left p-3 rounded-xl bg-dispatch-panel/70 border border-rose-900/40 hover:border-rose-500 hover:bg-rose-950/20 transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-mono text-xs font-bold text-rose-400 bg-rose-950/70 border border-rose-800/60 px-2 py-0.5 rounded">02E01</span>
                            <span class="text-[10px] font-mono text-slate-400">ECHO</span>
                        </div>
                        <div class="font-tech text-sm font-bold text-slate-100 group-hover:text-rose-300">Anaphylaxie Grad III</div>
                        <div class="text-[11px] text-slate-400 line-clamp-2 mt-1">Wespenstich Halsbereich. Quincke-Ödem, inspiratorischer Stridor, RR 70/40.</div>
                    </div>
                    <div class="text-[10px] text-slate-400 mt-2 font-mono flex items-center justify-between pt-1 border-t border-slate-800/80">
                        <span>1140 Wien</span><span>31 J. • W</span>
                    </div>
                </button>

                <button onclick="selectScenario('CPR')" class="group text-left p-3 rounded-xl bg-dispatch-panel/70 border border-red-600/60 hover:border-red-400 hover:bg-red-950/30 transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-mono text-xs font-bold text-red-300 bg-red-900 border border-red-500 px-2 py-0.5 rounded animate-pulse">09E01</span>
                            <span class="text-[10px] font-mono text-red-400 font-bold">REANIMATION</span>
                        </div>
                        <div class="font-tech text-sm font-bold text-red-200 group-hover:text-white">Herz-Kreislauf-Stillstand</div>
                        <div class="text-[11px] text-slate-300 line-clamp-2 mt-1">Plötzlicher Kollaps, keine Atmung, TCPR (Telefonanleitung) läuft.</div>
                    </div>
                    <div class="text-[10px] text-slate-400 mt-2 font-mono flex items-center justify-between pt-1 border-t border-slate-800/80">
                        <span>1010 Wien</span><span>69 J. • M</span>
                    </div>
                </button>
            </div>
        </section>

        <!-- Formular & Senden -->
        <section class="w-[48%] flex flex-col bg-dispatch-panel border border-slate-800 rounded-2xl p-4 shadow-xl overflow-hidden">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-sm bg-red-500"></span>
                    <h2 class="font-tech text-sm font-bold tracking-wider text-slate-100">AUFTRAGS-EDITOR</h2>
                </div>
                <button onclick="randomizeMissionNumbers()" class="text-[11px] font-mono text-sky-400 hover:text-sky-300 flex items-center gap-1">
                    <span>↻ R/T Neu generieren</span>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto pr-1 py-3 flex flex-col gap-3 text-xs">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="font-mono text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Auftrag (EN / R-NR)</label>
                        <input id="edit_rnr" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 font-mono font-bold text-red-400 text-sm focus:border-red-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="font-mono text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Transport (T-NR)</label>
                        <input id="edit_tnr" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 font-mono font-bold text-slate-200 text-sm focus:border-sky-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="font-mono text-[10px] text-slate-400 uppercase tracking-wider block mb-1">AMPDS Code & Text</label>
                        <input id="edit_code" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 font-mono font-bold text-yellow-400 focus:border-yellow-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="font-mono text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Patientenname</label>
                        <input id="edit_name" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 font-semibold text-slate-100 focus:border-sky-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="font-mono text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Geburtsdatum</label>
                        <input id="edit_geb" oninput="recalcSV()" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-2.5 py-1.5 font-mono text-slate-200 focus:border-sky-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="font-mono text-[10px] text-slate-400 uppercase tracking-wider block mb-1">SV-Nummer</label>
                        <input id="edit_sv" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-2.5 py-1.5 font-mono font-bold text-emerald-400 focus:border-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="font-mono text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Geschlecht</label>
                        <select id="edit_geschl" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-2 py-1.5 font-medium text-slate-200 focus:border-sky-500 focus:outline-none">
                            <option value="männlich">männlich</option>
                            <option value="weiblich">weiblich</option>
                            <option value="divers">divers</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="font-mono text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Berufungsort (BO / Einsatzadresse)</label>
                    <textarea id="edit_bo" rows="3" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 font-mono text-xs text-sky-200 resize-none focus:border-sky-500 focus:outline-none leading-relaxed"></textarea>
                </div>

                <div>
                    <label class="font-mono text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Einsatz-Freitext (FTEXT)</label>
                    <textarea id="edit_ftext" rows="2" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 font-mono text-xs text-slate-300 resize-none focus:border-sky-500 focus:outline-none"></textarea>
                </div>
            </div>

            <button onclick="dispatchMission()" class="mt-2 w-full py-4 rounded-xl bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-red-600 active:scale-[0.99] font-tech font-bold text-base tracking-widest text-white glow-red flex items-center justify-center gap-3 transition-all">
                <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                <span>🚨 ALARMIERUNG JETZT SENDEN (<span id="btn-room-tag">SIM1</span>)</span>
            </button>
        </section>
    </main>

    <!-- Historie -->
    <footer class="h-28 bg-dispatch-card/90 border-t border-slate-800 px-5 py-2 shrink-0 flex flex-col justify-between">
        <div class="flex items-center justify-between text-xs font-mono text-slate-400 border-b border-slate-800 pb-1">
            <span>LETZTE DISPATCH-PROTOKOLLE</span>
            <span id="log-counter">0 Einsätze übertragen</span>
        </div>
        <div id="dispatch-log" class="flex-1 overflow-y-auto text-[11px] font-mono space-y-1 py-1">
            <div class="text-slate-400 italic">Noch keine Alarmierung in dieser Sitzung ausgelöst.</div>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let roomCode = (urlParams.get('room') || 'SIM1').toUpperCase();
        document.getElementById('input-room').value = roomCode;
        document.getElementById('btn-room-tag').innerText = roomCode;

        let ws = null;
        let bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('sim_data_' + roomCode) : null;

        function connectWebSocket() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            // Falls lokal aufgerufen, den Render-Host verwenden, ansonsten den aktuellen Host
            const host = window.location.host || 'sim-data-terminal.onrender.com';
            ws = new WebSocket(`${proto}//${host}?room=${encodeURIComponent(roomCode)}`);

            ws.onopen = () => {
                document.getElementById('conn-dot').className = 'w-2 h-2 rounded-full bg-emerald-500';
                document.getElementById('conn-text').className = 'text-xs font-mono font-medium text-emerald-400';
                document.getElementById('conn-text').innerText = 'ONLINE';
            };

            ws.onclose = () => {
                document.getElementById('conn-dot').className = 'w-2 h-2 rounded-full bg-amber-500 animate-ping';
                document.getElementById('conn-text').className = 'text-xs font-mono font-medium text-amber-400';
                document.getElementById('conn-text').innerText = 'OFFLINE';
                setTimeout(connectWebSocket, 2500);
            };

            ws.onerror = () => {
                document.getElementById('conn-dot').className = 'w-2 h-2 rounded-full bg-amber-500 animate-ping';
                document.getElementById('conn-text').className = 'text-xs font-mono font-medium text-amber-400';
                document.getElementById('conn-text').innerText = 'OFFLINE';
            };
        }
        connectWebSocket();

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && (!ws || ws.readyState !== WebSocket.OPEN)) {
                connectWebSocket();
            }
        });

        function changeRoom() {
            const newRoom = document.getElementById('input-room').value.trim().toUpperCase() || 'SIM1';
            window.location.search = `?room=${encodeURIComponent(newRoom)}`;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('de-DE');
            document.getElementById('clock-date').innerText = now.toLocaleDateString('de-DE');
        }
        setInterval(updateClock, 1000);
        updateClock();

        function generateRandom(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function generateSV(gebDatum) {
            try {
                const parts = gebDatum.split('.');
                const tt = parts[0].padStart(2, '0');
                const mm = parts[1].padStart(2, '0');
                const jj = parts[2].substring(2, 4);
                const random4 = generateRandom(1000, 9999);
                return `${random4} ${tt}${mm}${jj}`;
            } catch(e) {
                return '1234 010190';
            }
        }

        function randomizeMissionNumbers() {
            const yr = new Date().getFullYear().toString().substring(2);
            document.getElementById('edit_rnr').value = `R${yr}${generateRandom(100000, 999999)}`;
            document.getElementById('edit_tnr').value = `T${yr}${generateRandom(100000, 999999)}`;
        }

        function recalcSV() {
            const geb = document.getElementById('edit_geb').value;
            document.getElementById('edit_sv').value = generateSV(geb);
        }

        const scenarios = {
            'ACS': {

        function selectScenario(key) {
            const sc = scenarios[key];
            if (!sc) return;

            randomizeMissionNumbers();
            document.getElementById('edit_code').value = sc.code;
            document.getElementById('edit_name').value = sc.name;
            document.getElementById('edit_geb').value = sc.geb;
            document.getElementById('edit_geschl').value = sc.geschlecht;
            document.getElementById('edit_bo').value = sc.bo;
            document.getElementById('edit_ftext').value = sc.ftext;
            recalcSV();
        }

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        window.addEventListener('touchstart', initAudio, { once: true });
        window.addEventListener('click', initAudio, { once: true });

        function playAlertTone() {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                [880, 1174, 1567].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.18);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.2);
                });
            } catch(e){}
        }

        let dispatchCount = 0;

        function dispatchMission() {
            const now = new Date();
            const ts = `${now.toLocaleDateString('de-DE')} ${now.toLocaleTimeString('de-DE')}`;
            const rNr = document.getElementById('edit_rnr').value;

            const payload = {
                type: 'ALARM',
                rNummer: rNr,
                r_nr: rNr,
                tNummer: document.getElementById('edit_tnr').value,
                t_nr: document.getElementById('edit_tnr').value,
                timestamp: ts,
                code: document.getElementById('edit_code').value,
                patientName: document.getElementById('edit_name').value,
                name: document.getElementById('edit_name').value,
                gebDat: document.getElementById('edit_geb').value,
                geb: document.getElementById('edit_geb').value,
                svNummer: document.getElementById('edit_sv').value,
                sv: document.getElementById('edit_sv').value,
                geschlecht: document.getElementById('edit_geschl').value,
                bo: document.getElementById('edit_bo').value,
                ftext: document.getElementById('edit_ftext').value
            };

            const jsonStr = JSON.stringify(payload);

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(jsonStr);
            } else {
                connectWebSocket();
                setTimeout(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) ws.send(jsonStr);
                }, 400);
            }

            if (bc) bc.postMessage(payload);

            playAlertTone();

            dispatchCount++;
            document.getElementById('log-counter').innerText = `${dispatchCount} Einsätze übertragen`;

            const logBox = document.getElementById('dispatch-log');
            if (dispatchCount === 1) logBox.innerHTML = '';

            const logRow = document.createElement('div');
            logRow.className = 'flex items-center justify-between bg-slate-900/60 border-l-2 border-red-500 px-2 py-1 rounded text-slate-300';
            logRow.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="text-red-400 font-bold">[${now.toLocaleTimeString('de-DE')}]</span>
                    <span class="text-yellow-400 font-bold">${payload.rNummer}</span>
                    <span class="text-slate-400">${payload.code.split(' ')[0]}</span>
                    <span class="text-slate-200">${payload.patientName}</span>
                </div>
                <div class="text-slate-400 text-[10px]">RAUM: ${roomCode} ✓</div>
            `;
            logBox.prepend(logRow);
        }
