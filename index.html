<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sim System - Login</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #222; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 320px; }
        h2 { margin-top: 0; color: #f1f1f1; }
        input { width: 100%; padding: 12px; font-size: 18px; text-align: center; border-radius: 8px; border: 2px solid #444; background: #000; color: #fff; box-sizing: border-box; text-transform: uppercase; margin-bottom: 20px; font-weight: bold; letter-spacing: 2px; }
        button { width: 100%; padding: 14px; margin: 6px 0; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }
        .btn-term { background: #0055b3; color: #fff; }
        .btn-ctrl { background: #e24a2b; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sim Data System</h2>
        <label style="display:block; margin-bottom: 8px; font-size: 14px; color: #aaa;">Aktiver Raum-Code:</label>
        <input type="text" id="roomInput" value="SIM1" placeholder="RAUM CODE">
        
        <button class="btn-term" onclick="startApp('terminal.html')">💻 Data-Terminal</button>
        <button class="btn-ctrl" onclick="startApp('control.html')">📡 Leitstellen-Steuerung</button>
    </div>

    <script>
        function startApp(page) {
            const room = document.getElementById('roomInput').value.trim() || 'SIM1';
            location.href = `${page}?room=${encodeURIComponent(room)}`;
        }
    </script>
</body>
</html>
